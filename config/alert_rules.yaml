alerts:
  - name: high_request_latency
    severity: high
    condition: 'latency_p95_ms > 3000'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_request_errors
    severity: critical
    condition: 'error_rate_pct > 2 or retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: degraded_answer_quality
    severity: medium
    condition: 'quality_score_avg < 0.75'
    duration: 10m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: llm-oncall
    runbook: docs/alerts.md#alert-3
